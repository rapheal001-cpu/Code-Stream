<div
	class="min-h-screen bg-gray-50 flex items-center justify-center px-4 py-12 sm:px-6 lg:px-8">
	<div class="w-full max-w-2xl">
		<!-- Card -->
		<div
			class="bg-white rounded-3xl shadow-xl shadow-gray-200/50 overflow-hidden">
			<!-- Top Accent -->
			<div
				class="h-2 bg-gradient-to-r from-indigo-600 via-indigo-900 to-indigo-600"></div>

			<div class="px-8 py-10 sm:px-12 text-center">
				<!-- Welcome -->
				<div class="mb-8">
					<div
						class="mx-auto w-16 h-16 bg-indigo-100 rounded-2xl flex items-center justify-center mb-4">
						<span class="text-3xl">👋</span>
					</div>
					<h1
						class="text-3xl font-bold text-gray-900 tracking-tight mb-2">
						Welcome, {{ request.user.username|title }}!
					</h1>
					<p class="text-gray-600 text-lg">
						Choose how you want to use Code Stream
					</p>
				</div>

				<!-- Role Selection -->
				<form
					action="{% url 'core:index-view' %}"
					method="POST"
					class="space-y-6">
					{% csrf_token %}

					<div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
						<!-- Student Option -->
						<label class="relative cursor-pointer group">
							<input
								type="radio"
								name="role"
								value="student"
								class="peer sr-only"
								{%
								if
								form.role.value=""
								="student"
								or
								not
								form.role.value
								%}checked{%
								endif
								%} />
							<div
								class="p-6 rounded-2xl border-2 border-gray-200 bg-white hover:border-indigo-300 hover:bg-indigo-50/30 transition-all duration-200 peer-checked:border-indigo-600 peer-checked:bg-indigo-50 peer-checked:shadow-md text-center h-full">
								<div
									class="w-14 h-14 bg-indigo-100 rounded-xl flex items-center justify-center mx-auto mb-4 group-hover:scale-110 transition-transform duration-200">
									<svg
										class="w-7 h-7 text-indigo-600"
										fill="none"
										stroke="currentColor"
										stroke-width="2"
										viewBox="0 0 24 24">
										<path
											d="M12 14l9-5-9-5-9 5 9 5z"></path>
										<path
											d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z"></path>
									</svg>
								</div>
								<h3
									class="text-lg font-bold text-gray-900 mb-2">
									Student
								</h3>
								<p
									class="text-sm text-gray-600 leading-relaxed">
									Learn from expert instructors, subscribe to
									courses, and build your skills with
									practical video lessons.
								</p>
								<div
									class="mt-4 flex flex-wrap gap-2 justify-center">
									<span
										class="px-2 py-1 bg-indigo-100 text-indigo-700 text-xs font-medium rounded-lg"
										>Watch courses</span
									>
									<span
										class="px-2 py-1 bg-indigo-100 text-indigo-700 text-xs font-medium rounded-lg"
										>Track progress</span
									>
								</div>
							</div>
							<div
								class="absolute top-4 right-4 w-6 h-6 bg-indigo-600 rounded-full flex items-center justify-center opacity-0 peer-checked:opacity-100 transition-opacity">
								<svg
									class="w-4 h-4 text-white"
									fill="none"
									stroke="currentColor"
									stroke-width="3"
									viewBox="0 0 24 24">
									<path d="M5 13l4 4L19 7"></path>
								</svg>
							</div>
						</label>

						<!-- Instructor Option -->
						<label class="relative cursor-pointer group">
							<input
								type="radio"
								name="role"
								value="instructor"
								class="peer sr-only"
								{%
								if
								form.role.value=""
								="instructor"
								%}checked{%
								endif
								%} />
							<div
								class="p-6 rounded-2xl border-2 border-gray-200 bg-white hover:border-indigo-300 hover:bg-indigo-50/30 transition-all duration-200 peer-checked:border-indigo-600 peer-checked:bg-indigo-50 peer-checked:shadow-md text-center h-full">
								<div
									class="w-14 h-14 bg-indigo-100 rounded-xl flex items-center justify-center mx-auto mb-4 group-hover:scale-110 transition-transform duration-200">
									<svg
										class="w-7 h-7 text-indigo-600"
										fill="none"
										stroke="currentColor"
										stroke-width="2"
										viewBox="0 0 24 24">
										<path
											d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z"></path>
									</svg>
								</div>
								<h3
									class="text-lg font-bold text-gray-900 mb-2">
									Instructor
								</h3>
								<p
									class="text-sm text-gray-600 leading-relaxed">
									Create and upload courses, set your prices,
									and grow your audience while earning from
									your expertise.
								</p>
								<div
									class="mt-4 flex flex-wrap gap-2 justify-center">
									<span
										class="px-2 py-1 bg-indigo-100 text-indigo-700 text-xs font-medium rounded-lg"
										>Upload videos</span
									>
									<span
										class="px-2 py-1 bg-indigo-100 text-indigo-700 text-xs font-medium rounded-lg"
										>Earn money</span
									>
								</div>
							</div>
							<div
								class="absolute top-4 right-4 w-6 h-6 bg-indigo-600 rounded-full flex items-center justify-center opacity-0 peer-checked:opacity-100 transition-opacity">
								<svg
									class="w-4 h-4 text-white"
									fill="none"
									stroke="currentColor"
									stroke-width="3"
									viewBox="0 0 24 24">
									<path d="M5 13l4 4L19 7"></path>
								</svg>
							</div>
						</label>
					</div>

					<!-- Errors -->
					{% for error in form.role.errors %}
					<div
						class="rounded-xl bg-red-50 p-4 border border-red-100 flex items-center gap-3">
						<svg
							class="w-5 h-5 text-red-400 flex-shrink-0"
							fill="none"
							stroke="currentColor"
							stroke-width="2"
							viewBox="0 0 24 24">
							<path
								d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
						</svg>
						<p class="text-sm text-red-700">{{ error }}</p>
					</div>
					{% endfor %}

					<!-- Submit -->
					<button
						type="submit"
						class="w-full flex items-center justify-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-4 rounded-xl transition-all duration-200 shadow-lg shadow-indigo-200 hover:shadow-xl hover:shadow-indigo-300 active:scale-[0.98] text-lg">
						Continue
						<svg
							class="w-5 h-5"
							fill="none"
							stroke="currentColor"
							stroke-width="2"
							viewBox="0 0 24 24">
							<path d="M13 7l5 5m0 0l-5 5m5-5H6"></path>
						</svg>
					</button>
				</form>

				<!-- Note -->
				<p class="mt-6 text-sm text-gray-500">
					You can't change your role later
				</p>
			</div>
		</div>
	</div>
</div>
