{% load humanize %}

{% for notification in notifications %}

<div id="notification-{{ notification.id }}"
     class="group relative rounded-xl p-4 border transition-all duration-200
            {% if not notification.is_read %}
              bg-white/10 backdrop-blur-md border-indigo-400/30 shadow-lg shadow-indigo-500/10
            {% else %}
              bg-white/5 backdrop-blur-sm border-white/10
            {% endif %}">
  
  <div class="flex items-start gap-4">
    
    <!-- Icon -->
    <div class="relative shrink-0">
      <div class="w-10 h-10 rounded-full flex items-center justify-center
                  {% if not notification.is_read %}bg-indigo-500/20{% else %}bg-white/10{% endif %}">
        <svg class="w-5 h-5 {% if not notification.is_read %}text-indigo-300{% else %}text-white/60{% endif %}"
             fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round"
                d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
        </svg>
      </div>
      {% if not notification.is_read %}
      <span class="absolute -top-0.5 -right-0.5 w-3 h-3 bg-indigo-400 rounded-full border-2 border-indigo-900 animate-pulse"></span>
      {% endif %}
    </div>

    <!-- Content -->
    <div class="flex-1 min-w-0">
      <a href="{{ notification.get_absolute_url }}" class="block hover:opacity-80 transition-opacity">
        <div class="flex items-center gap-2 mb-1">
          <h2 class="text-sm font-semibold text-white">{{ notification.name }}</h2>
        </div>
        <p class="text-sm text-white/70 leading-relaxed mb-2 line-clamp-2">{{ notification.message }}</p>
        <div class="flex items-center gap-1.5 text-xs text-white/40">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10"/>
            <polyline points="12 6 12 12 16 14"/>
          </svg>
          <span>{{ notification.created_at|naturaltime }}</span>
        </div>
      </a>
    </div>

    <!-- Delete Action -->
    <div class="shrink-0">
      <form hx-post="{% url 'notification-view' %}"
            hx-trigger="submit"
            hx-target="#notification-{{ notification.id }}"
            hx-swap="outerHTML swap:200ms"
            class="inline">
        {% csrf_token %}
        <input type="hidden" name="notification_id" value="{{ notification.id }}"/>
        <button type="submit"
                class="p-2 text-white/40 hover:text-red-400 hover:bg-red-400/10 rounded-lg transition-colors"
                title="Delete">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round"
                  d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
          </svg>
        </button>
      </form>
    </div>
  </div>
</div>

{% endfor %}
